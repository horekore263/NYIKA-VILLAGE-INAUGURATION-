const originalNodes = [];

function normalise(value){
  return value.replace(/\s+/g," ").trim();
}

function collectTextNodes(){
  const walker = document.createTreeWalker(
    document.body,
    NodeFilter.SHOW_TEXT
  );

  let node;

  while(node = walker.nextNode()){

    const parent = node.parentElement;

    if(!parent) continue;

    if(
      parent.tagName === "SCRIPT" ||
      parent.tagName === "STYLE"
    ) continue;

    const text = normalise(node.nodeValue);

    if(!text) continue;

    originalNodes.push({
      node: node,
      raw: node.nodeValue,
      english: text
    });
  }
}

function applyShona(){

  originalNodes.forEach(item => {

    if(shona[item.english]){

      const leading =
        item.raw.match(/^\s*/)[0];

      const trailing =
        item.raw.match(/\s*$/)[0];

      item.node.nodeValue =
        leading +
        shona[item.english] +
        trailing;
    }
  });

  document.documentElement.lang = "sn";

  document.title =
    "Kugadzwa kwaTawanda Kaseke saSabhuku weNyika Village";
}

function applyEnglish(){

  originalNodes.forEach(item => {
    item.node.nodeValue = item.raw;
  });

  document.documentElement.lang = "en";

  document.title =
    "Inauguration of Tawanda Kaseke as Sabhuku, Nyika Village";
}

function setLanguage(language){

  if(language === "sn"){
    applyShona();
  }
  else{
    applyEnglish();
    language = "en";
  }

  document
    .getElementById("lang-en")
    .classList.toggle(
      "active",
      language === "en"
    );

  document
    .getElementById("lang-sn")
    .classList.toggle(
      "active",
      language === "sn"
    );

  try{
    localStorage.setItem(
      "nyika-language",
      language
    );
  }
  catch(error){}
}

collectTextNodes();

const navLinks =
  document.querySelector("nav .links");

if(navLinks){

  const switcher =
    document.createElement("div");

  switcher.className =
    "lang-switch";

  switcher.setAttribute(
    "aria-label",
    "Choose language"
  );

  switcher.innerHTML =
    '<button type="button" id="lang-en">ENGLISH</button>' +
    '<button type="button" id="lang-sn">SHONA</button>';

  navLinks.appendChild(switcher);
}

document
  .getElementById("lang-en")
  .addEventListener(
    "click",
    function(){
      setLanguage("en");
    }
  );

document
  .getElementById("lang-sn")
  .addEventListener(
    "click",
    function(){
      setLanguage("sn");
    }
  );

let savedLanguage = "en";

try{
  savedLanguage =
    localStorage.getItem(
      "nyika-language"
    ) || "en";
}
catch(error){}

setLanguage(savedLanguage);

})();
